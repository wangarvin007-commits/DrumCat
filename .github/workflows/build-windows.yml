name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to receive the installer
        required: true
        default: v0.1.0
  push:
    branches:
      - agent/windows-release

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
          tauriScript: pnpm tauri
          args: --bundles nsis

      - name: Upload installer to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0' }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $source = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" |
            Select-Object -First 1

          if (-not $source) {
            throw "Windows NSIS installer was not generated."
          }

          $assetName = "DrumCat_$($package.version)_Windows_x64_setup.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item $source.FullName $assetPath
          gh release upload $env:RELEASE_TAG $assetPath --clobber
