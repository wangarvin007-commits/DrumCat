name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to receive the installer
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend and behavior checks
        run: |
          pnpm build:icon
          pnpm typecheck
          pnpm lint:check
          pnpm test:mvp

      - name: Run Rust checks
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
          tauriScript: pnpm tauri
          args: --bundles nsis

      - name: Locate native executable
        shell: pwsh
        run: |
          $binary = Get-ChildItem target/release -Filter "*.exe" |
            Where-Object { $_.Name -notlike "*setup*" } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $binary) {
            throw "DrumCat native executable was not generated."
          }

          "DRUMCAT_BINARY=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Windows UI test dependencies
        shell: pwsh
        run: |
          pnpm --dir e2e install --frozen-lockfile

      - name: Verify native executable starts independently
        shell: pwsh
        run: |
          Get-Process -Name "drum-cat" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          $app = $null
          try {
            $app = Start-Process -FilePath $env:DRUMCAT_BINARY -PassThru
            Start-Sleep -Seconds 8

            if ($app.HasExited) {
              throw "DrumCat native executable exited before WebDriver startup."
            }

            Write-Host "DrumCat native executable stayed alive for 8 seconds."
          }
          finally {
            if ($app -and -not $app.HasExited) {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Prepare isolated WebView2 automation profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "drumcat-wdio-webview2"
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $profile -Force | Out-Null

          "DRUMCAT_WEBDRIVER_USER_DATA_DIR=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WEBVIEW2_USER_DATA_FOLDER=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Windows native UI tests
        run: pnpm --dir e2e test

      - name: Collect Windows UI diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-Process -Name "drum-cat", "tauri-driver", "msedgedriver" -ErrorAction SilentlyContinue |
            Format-Table Id, ProcessName, Responding, StartTime

          $activePorts = Get-ChildItem $env:DRUMCAT_WEBDRIVER_USER_DATA_DIR -Filter "DevToolsActivePort" -Recurse -Force -ErrorAction SilentlyContinue
          if ($activePorts) {
            foreach ($activePort in $activePorts) {
              Write-Host "==== $($activePort.FullName)"
              Get-Content $activePort.FullName -ErrorAction SilentlyContinue
            }
          }
          else {
            Write-Host "No DevToolsActivePort file found under $env:DRUMCAT_WEBDRIVER_USER_DATA_DIR"
            Get-ChildItem $env:DRUMCAT_WEBDRIVER_USER_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue |
              Select-Object -First 80 -ExpandProperty FullName
          }

          $logs = Get-ChildItem $env:LOCALAPPDATA, $env:APPDATA -Filter "DrumCat.log" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 4
          foreach ($log in $logs) {
            Write-Host "==== $($log.FullName)"
            Get-Content $log.FullName -Tail 120
          }

          Get-ChildItem e2e/logs -File -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "==== $($_.FullName)"
              Get-Content $_.FullName -Tail 160
            }

      - name: Smoke-test silent installer and installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" |
            Select-Object -First 1

          if (-not $installer) {
            throw "Windows NSIS installer was not generated."
          }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent installer failed with exit code $($install.ExitCode)."
          }

          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "DrumCat" } |
            Select-Object -First 1

          if (-not $entry) {
            throw "DrumCat uninstall registry entry was not found after installation."
          }

          $candidateRoots = @(
            $entry.InstallLocation,
            (Join-Path $env:LOCALAPPDATA "DrumCat"),
            (Join-Path $env:LOCALAPPDATA "Programs\DrumCat"),
            (Join-Path $env:ProgramFiles "DrumCat")
          ) |
            Where-Object { $_ -and (Test-Path $_) }
          $installedBinary = $candidateRoots |
            ForEach-Object {
              Get-ChildItem $_ -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -in @("DrumCat.exe", "drum-cat.exe") -and
                  $_.FullName -notlike "*target\release*"
                }
            } |
            Select-Object -First 1

          if (-not $installedBinary) {
            throw "Installed DrumCat executable was not found."
          }

          Get-Process -Name "drum-cat" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $installedBinary.FullName -PassThru
          Start-Sleep -Seconds 8

          if ($app.HasExited) {
            throw "Installed DrumCat exited during the 8-second smoke test."
          }

          Stop-Process -Id $app.Id -Force

      - name: Upload installer to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0' }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $source = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" |
            Select-Object -First 1

          if (-not $source) {
            throw "Windows NSIS installer was not generated."
          }

          $assetName = "DrumCat_$($package.version)_Windows_x64_setup.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item $source.FullName $assetPath
          gh release upload $env:RELEASE_TAG $assetPath --clobber
