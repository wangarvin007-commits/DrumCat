name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to receive the installer
        required: true
        default: v0.1.0
  push:
    branches:
      - agent/windows-release

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || 'v0.1.0' }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          tauriScript: pnpm tauri
          args: --bundles nsis
          releaseAssetNamePattern: DrumCat_[version]_Windows_[arch][_setup][ext]
